name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  backend-win:
    name: Backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build backend.exe
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller
          .venv\Scripts\pyinstaller --onefile --clean --name backend `
            --distpath dist --workpath output\pybuild --specpath output `
            --add-data "${{ github.workspace }}\app\static;app/static" run_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-win
          path: dist/backend.exe

  backend-mac-arm64:
    name: Backend (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build backend (arm64)
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          rm -f dist/backend
          pyinstaller --onefile --clean --name backend \
            --distpath dist --workpath output/pybuild --specpath output \
            --add-data "${{ github.workspace }}/app/static:app/static" run_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-mac-arm64
          path: dist/backend

  backend-mac-x64:
    name: Backend (macOS x64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build backend (x64)
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          rm -f dist/backend
          pyinstaller --onefile --clean --name backend \
            --distpath dist --workpath output/pybuild --specpath output \
            --add-data "${{ github.workspace }}/app/static:app/static" run_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: backend-mac-x64
          path: dist/backend

  app-win:
    name: Installer (Windows)
    needs: backend-win
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: backend-win
          path: dist
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: installers-win
          path: |
            dist/Video DNA Analyzer Setup *.exe
            dist/Video DNA Analyzer *.exe

  app-mac-arm64:
    name: Installer (macOS arm64)
    needs: backend-mac-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: backend-mac-arm64
          path: dist
      - run: npm ci
      - run: npx electron-builder --mac --arm64 --config electron/builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip

  app-mac-x64:
    name: Installer (macOS x64)
    needs: backend-mac-x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: backend-mac-x64
          path: dist
      - run: npm ci
      - run: npx electron-builder --mac --x64 --config electron/builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac-x64
          path: |
            dist/*.dmg
            dist/*.zip