appId: com.videodna.analyzer
productName: "Video DNA Analyzer"
copyright: Copyright © 2025 Video DNA Team

directories:
  output: dist
  buildResources: electron

files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

extraResources: []

win:
  target:
    - target: portable
      arch: [x64]
  publish: null

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  publish: null

linux:
  target:
    - target: AppImage
      arch: [x64]
  publish: null
