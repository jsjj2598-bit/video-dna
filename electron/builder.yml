appId: com.videodna.analyzer
productName: "Video DNA Analyzer"
copyright: Copyright © 2026 Video DNA contributors

directories:
  output: dist
  buildResources: electron

files:
  - "electron/**/*"
  - "package.json"

# 将 PyInstaller 编译的后端打进安装包（Windows 为 resources/backend.exe，macOS 为 resources/backend）
# filter 会复制 dist 下存在的 backend / backend.exe；未编译时删除此段即可
extraResources:
  - from: dist
    to: .
    filter:
      - backend
      - backend.exe

win:
  target:
    - nsis
    - portable
  publish: null
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  publish: null
  identity: null
  category: public.app-category.video

linux:
  target:
    - target: AppImage
      arch: [x64]
  publish: null

asar: true
npmRebuild: false
