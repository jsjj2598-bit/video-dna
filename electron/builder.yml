appId: com.videodna.analyzer
productName: "Video DNA Analyzer"
copyright: Copyright © 2025 Video DNA Team

directories:
  output: dist
  buildResources: electron

# 注意：portable EXE 不包含 Python 后端。
# 安装后需配合 start_desktop.cmd 使用（自动启动后端 + Electron 窗口）
files:
  - "electron/**/*"
  - "package.json"

extraResources: []

win:
  target:
    - nsis
    - portable
  publish: null
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  publish: null

linux:
  target:
    - target: AppImage
      arch: [x64]
  publish: null

asar: true
npmRebuild: false