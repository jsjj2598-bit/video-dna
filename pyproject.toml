[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dna-analyzer"
version = "0.3.1"
description = "Local-first video editing structure analysis and interchange tools"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Video DNA contributors" }]
keywords = ["video", "editing", "scene-detection", "fastapi", "electron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "scenedetect>=0.6.3,<0.8",
  "opencv-python>=4.8,<5",
  "librosa>=0.10.1,<0.12",
  "numpy>=1.24,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0,<2"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
video-dna = "app.cli:main"

[project.urls]
Homepage = "https://github.com/jsjj2598-bit/video-dna"
Repository = "https://github.com/jsjj2598-bit/video-dna.git"
Issues = "https://github.com/jsjj2598-bit/video-dna/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["dist", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
